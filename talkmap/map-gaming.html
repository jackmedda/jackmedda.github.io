<!DOCTYPE html>
<html>
<head>
    <title>World Explorers Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- MarkerCluster -->
    <link rel="stylesheet" href="leaflet_dist/MarkerCluster.css" />
    <link rel="stylesheet" href="leaflet_dist/MarkerCluster.Default.css" />
    <script src="leaflet_dist/leaflet.markercluster-src.js"></script>
    
    <!-- Location Data -->
    <script src="org-locations.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0F0326;
            font-family: 'Segoe UI', sans-serif;
        }
        
        #map {
            width: 100%;
            height: 100vh;
        }
        
        /* Dark theme for map */
        .leaflet-container {
            background: #0F0326;
        }
        
        /* Custom gem marker */
        .gem-marker {
            width: 24px !important;
            height: 24px !important;
            margin-left: -12px !important;
            margin-top: -12px !important;
        }
        
        .gem-marker-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #CE93D8, #9C27B0, #6A1B9A);
            clip-path: polygon(50% 0%, 100% 35%, 100% 65%, 50% 100%, 0% 65%, 0% 35%);
            animation: gemPulse 2s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(156, 39, 176, 0.8);
        }
        
        @keyframes gemPulse {
            0%, 100% { 
                transform: scale(1); 
                filter: brightness(1);
            }
            50% { 
                transform: scale(1.1); 
                filter: brightness(1.3);
            }
        }
        
        /* Custom cluster styling */
        .marker-cluster-small,
        .marker-cluster-medium,
        .marker-cluster-large {
            background: radial-gradient(circle, rgba(168, 85, 247, 0.6), rgba(75, 0, 130, 0.8)) !important;
            border: 2px solid #FFD700 !important;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.8), 0 0 40px rgba(255, 215, 0, 0.4) !important;
        }
        
        .marker-cluster-small div,
        .marker-cluster-medium div,
        .marker-cluster-large div {
            background: linear-gradient(135deg, #7B2D9E, #4A1B6D) !important;
            border: 2px solid #FFD700 !important;
            color: #FFD700 !important;
            font-weight: bold !important;
            font-family: 'Bangers', cursive, sans-serif !important;
            letter-spacing: 1px !important;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5) !important;
        }
        
        /* Popup styling */
        .leaflet-popup-content-wrapper {
            background: linear-gradient(135deg, #1A0A3E, #0F0326) !important;
            border: 2px solid #A855F7 !important;
            border-radius: 12px !important;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5) !important;
        }
        
        .leaflet-popup-content {
            color: #E9D5FF !important;
            font-family: 'Nunito', sans-serif !important;
            font-size: 14px !important;
            margin: 10px 15px !important;
        }
        
        .leaflet-popup-tip {
            background: #1A0A3E !important;
            border: 2px solid #A855F7 !important;
        }
        
        .leaflet-popup-close-button {
            color: #FFD700 !important;
        }
        
        .leaflet-popup-close-button:hover {
            color: #FFEA00 !important;
        }
        
        /* Attribution styling */
        .leaflet-control-attribution {
            background: rgba(15, 3, 38, 0.8) !important;
            color: rgba(255, 255, 255, 0.5) !important;
            font-size: 10px !important;
        }
        
        .leaflet-control-attribution a {
            color: #A855F7 !important;
        }
        
        /* Zoom controls */
        .leaflet-control-zoom a {
            background: linear-gradient(135deg, #1A0A3E, #0F0326) !important;
            border: 2px solid #7B2D9E !important;
            color: #FFD700 !important;
        }
        
        .leaflet-control-zoom a:hover {
            background: linear-gradient(135deg, #7B2D9E, #4A1B6D) !important;
            border-color: #FFD700 !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script type="text/javascript">
        // Dark themed tile layer (CartoDB Dark Matter)
        var darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        });
        
        // Alternative: Stadia Alidade Smooth Dark
        var stadiaDark = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a>'
        });
        
        // Create map centered on Europe
        var latlng = L.latLng(30, 10);
        var map = L.map('map', {
            center: latlng, 
            zoom: 2, 
            layers: [darkTiles],
            zoomControl: true
        });
        
        // Custom gem icon
        var gemIcon = L.divIcon({
            className: 'gem-marker',
            html: '<div class="gem-marker-inner"></div>',
            iconSize: [24, 24],
            iconAnchor: [12, 12],
            popupAnchor: [0, -12]
        });
        
        // Marker cluster with custom styling
        var markers = L.markerClusterGroup({
            showCoverageOnHover: true,
            maxClusterRadius: 60,
            spiderfyOnMaxZoom: true,
            zoomToBoundsOnClick: true
        });
        
        // Add markers from location data
        if (typeof addressPoints !== 'undefined') {
            for (var i = 0; i < addressPoints.length; i++) {
                var a = addressPoints[i];
                var title = a[0];
                var marker = L.marker(new L.LatLng(a[1], a[2]), { 
                    title: title,
                    icon: gemIcon
                });
                marker.bindPopup('<strong>📍 ' + title + '</strong>');
                markers.addLayer(marker);
            }
        }
        
        map.addLayer(markers);
        
        // Fit bounds if we have markers
        if (markers.getLayers().length > 0) {
            map.fitBounds(markers.getBounds().pad(0.1));
        }
    </script>
</body>
</html>
